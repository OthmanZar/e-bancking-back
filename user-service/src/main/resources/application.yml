
spring:

  config:
    import: optional:configserver:http://localhost:5000
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bankuser
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: clientConfirmation:com.ebanking.userservice.dtos.ClientConfirmation
server:
  port: 9091

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:9097/eureka

keycloak:
  url: http://localhost:9090
  realm: e-banking
  client-id: microservice-auth
  client-secret: brnb2a1II36HJAI7uMvwqYCx2fuQcCvk


