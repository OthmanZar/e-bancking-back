spring:
  config:
    import: optional:configserver:http://localhost:5000

  application:
    name: atm-service
  datasource:
    url: jdbc:postgresql://localhost:5432/atm
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 9096

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:9097/eureka