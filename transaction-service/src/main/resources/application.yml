spring:
  config:
    import: optional:configserver:http://localhost:5000
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/transaction
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: withdrawConfirmation:com.ebanking.transactionservice.dtos.WithdrawConfirmation,transferConfirmation:com.ebanking.transactionservice.dtos.TransferConfirmation,depositConfirmation:com.ebanking.transactionservice.dtos.DepositConfirmation,transactionNotification:com.ebanking.transactionservice.dtos.TransactionNotification
server:
  port: 9095
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:9097/eureka