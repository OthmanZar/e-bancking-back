
spring:
  application:
    name: discovery-service
  config:
    import: optional:configserver:http://localhost:5000
server:
  port: 9097
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/